# Cockpit API configuration (SDD §9 subset). Paths are relative to the FCC Agentic Optimisation repo root.
# Environment overrides: FCC_GCP_PROJECT, FCC_GCP_LOCATION, FCC_TEXT_MODEL, FCC_LIVE_MODEL, FCC_EMBED_MODEL.
data:
  root: sim_octave/data            # <batch>/*.csv below this folder are scanned
  source: bigquery                 # bigquery | csv (env FCC_DATA_SOURCE). bigquery = run rows from fcc_silver.telemetry_minute,
                                   # lab schedule + crude segments from fcc_bronze; local CSV only if BigQuery is unreachable
  bigquery: {project: fcc-soft-sensor, location: us-central1, silver: fcc_silver, bronze: fcc_bronze, cache_dir: bq_cache}
  primary_batch: full_v1           # source of truth for training, evaluation and the demo
  default_time_min: 600            # demo opens at 10:00: the soft sensor gives confident moves here (its last minutes are all "Not yet")
  default_run: random_s144         # demo default (clean 13h held-out test run in [742, 758.2] °F while s140 catches up)
  fallback_batches: [frontend_sample_1h]   # TEMPORARY: used only while full_v1 has no data rows; drops out automatically
  min_rows: 550                    # interim 600-720 min full_v1 live preview threshold (restore to 1500 when all 54 runs hit 1600)
  expected_rows: 1600              # primary run length; a NaN last row is dropped only while row count < expected_rows
  validity:                        # simulator breakdown cut (app/data/validity.py): models train / score only before it
    copy_run: 5                    # >= 5 consecutive exactly repeated rows = failed solver minutes
    lco_range: [650, 820]          # LCO T98 outside this (°F) or not finite = broken numerics
    hn_range: [450, 680]           # HN T98 likewise
  min_complete_train_runs: 4       # primary becomes active only once this many complete train runs (seed < test_seed_min)
  min_complete_test_runs: 1        # ... and this many complete held-out runs exist; partial runs are never used
  skip_dirs: [_staged, logs, _snapshots, _monitor]
  ts_base: "2026-09-01T00:00:00Z"   # synthetic wall-clock origin: ts = ts_base + time_min minutes
artifacts_dir: cockpit/api/artifacts
knowledge_dir: knowledge/corpus

targets: [LCO_T98_F, HN_T98_F]
specs:
  LCO_T98_F: {max: 765.0, margin: 0.0}
  HN_T98_F: {max: 540.0, margin: 0.0}
lab:
  reproducibility_F: 7.0            # R
  lims_delay_min: [45, 75]          # DECISIONS L3: result ~60 min after draw (matches simulator operator trim)
  gross_error_rate: 0.03
  timestamp_error_rate: 0.05
  seed: 42
regimes: {heavy: [0, 22], medium: [22, 26], light: [26, 99]}
feed_model:                          # DECISIONS S-8 / SDD-FEED-01..04 (engines/feed.py); feed class bands = regimes above
  smooth_min: 20                     # feed-API estimate smoothed over this window
  threshold_api: 0.7                 # change flagged when the smoothed estimate leaves its baseline by more than this
  baseline_tau_min: 480              # slow baseline while settled
  settle_api: 0.3                    # settled once it moves less than this per smooth_min ...
  dwell_min: 15                      # ... for this many minutes
  novel_at: 0.5                      # novelty at or above this holds advice
features:
  exclude: [LCO_T98_F, HN_T98_F, dist_condenser_eff, lab_sample, crude_id, event_code, cutpoint_auto, time_min,
            reactor_MB, mass_balance_err_pct]   # 6 Oct: simulator mass-balance diagnostics; no plant instrument
  exclude_patterns: ["*_dup", "eff_*"]
  key_tags: [T_tray06_F, T_tray13_F, P5_frac_psia, Tr_riser_F, feed_flow_lb_s, MV_PA2, MV_PA3]
  ewma_tau_min: 10
  max_ridge: 15
  max_gpr: 12
  max_pinn: 15
  max_abs_corr: 0.88
lags:                              # A6 / SDD-LAG: per (target, key tag) delay, identified on training runs only
  enabled: true
  max_lag_min: 60                  # search 0..max_lag_min minutes (input leads target)
  ar_order: 5                      # AR(p) prewhitening of the input's first differences (least squares)
  min_abs_ccf: auto                # significance limit on |CCF|; auto = 2/sqrt(N); below it -> lag 0
  rolling_mean: true               # also add the tag's mean over [t - lag, t] as a candidate feature
training:
  label_source: auto               # auto | lab | truth. auto = lab if >= min_labs clean labs else truth
  min_labs: 100                    # DECISIONS L5: full_v1 has ~110 clean train labs per property -> trains on labs
  truth_stride_min: 5              # when training on simulator truth: every 5th minute (6 Oct: was 30)
  label_window: "off"              # 6 Oct: keep every label. The v0.1 window (LCO 744-766, HN 520-542 °F) hid the
                                   # excursions, so the models predicted ~755 °F whatever happened
  calibrate_sigma: true            # 6 Oct: scale member sigmas so the out-of-fold 90 % band covers 90 %
  loro_max_runs: 8                 # fallback data (few short runs): leave-one-run-out
  test_seed_min: 140               # full_v1: random_s140..s153 held out (test); s100..s139 train
  lever_batches: [lever_v1]        # designed lever moves (scenario 'lever'); used only by the set-point surrogates
  lever_test_seed_min: 210         # lever_v1: lever_s210..s211 held out; lever_s200..s209 and s212..s251 train
  lever_test_seed_max: 211
  lever_min_rows: 360              # lever runs are used while still running once they have >= 6 h of data (each
                                   # lever's first designed move lands in hours 1-6); the fit is redone on restart as they grow
  group_kfold: 4                   # grouped K-fold by run on the train runs (admission + committee MSE)
  pinned_truth:                    # app/data/pinned.py: simulator T98 calc saturates (LCO 770.364 °F in 20 % of full_v1
    enabled: true                  # valid rows, HN 644.767 °F in 7 %). On = those minutes are missing labels + missing
    targets: [LCO_T98_F]           # eval truth for `targets`. Env FCC_MASK_PINNED_TRUTH=0|1|LCO_T98_F,HN_T98_F overrides
    ceilings: {LCO_T98_F: 770.364, HN_T98_F: 644.767}
    tol: 0.001
hybrid:
  draw_tray: {LCO_T98_F: T_tray13_F, HN_T98_F: T_tray06_F}
  p_ref_psia: 24.9
  # b_min: 0.5                       # 6 Oct: T98 must rise with the draw-tray temperature (fit gave -2.8 on closed-loop data)
gpr: {max_train: 450, max_train_cv: 350, restarts: 1}
pinn: {members: 5, hidden: [32, 32], epochs: 250, lr: 0.01, lambda_phys: 0.1, lambda_mono: 1.0, threads: 1,
       max_unlabelled: 1000, max_labelled: 3000}
admission: {rmse_ratio_max: 1.40, coverage90: [0.65, 0.99], mixture_exclude: [bayes_ridge_v1]}   # ridge: reference only (linear misfit sigma ~10 °F)
committee: {recent_n: 3}           # weights = 1/MSE over the last recent_n accepted labs (pooled over the run's scored
                                   # history so far, plus optional prior history); fewer -> out-of-fold (training) weights
steady_state:                      # A5 / SDD-MOD-06: transient minutes are excluded as lab training labels
  enabled: true
  window_min: 30                   # trailing rolling-window std of features.key_tags
  std_ratio: 3.0                   # transient if std > std_ratio x max(median rolling std of the tag in the run, floor)
                                   # floor = the tag's measurement-noise sigma (noise.*), so steady noise is not transient
  event_transient: true            # event_code != 0 -> transient
noise:                             # DECISIONS L6 process-measurement noise on model inputs (targets stay simulator truth)
  enabled: true
  temp_F: 0.5                      # tags ending _F (except targets and SP_*)
  pressure_psi: 0.05               # tags containing psia (except SP_*)
  flow_rel: 0.005                  # feed_flow_lb_s, prod_*, F_*, MV_* (relative sigma)
  seed: 7                          # per-run deterministic: sha256(run_id|seed|tag)
bias: {drift_per_day_F: 1.0, ramp_min: 30, max_abs_sigma: 3}
mixture: {grid_points: 200, bimodal_d: 2.0, bimodal_min_weight: 0.2}
gate: {w90_max_F: 14.0, hysteresis_ratio: 0.9, hysteresis_min: 10}
trust: {s1_spread_R: 0.5, s1_severe_R: 1.0, s4_rmse_R: 1.5, s4_severe_R: 3.0, s6_min_labels: 5,
        s7_severe_ratio: 1.5, physics_delta_F: 50, physics_severe_F: 100, gpr_sigma_ratio: 2.0}
dq: {frozen_enabled: false, frozen_min: 30, spike_mad_k: 5.0, range_pad: 0.10}
fallback: {hold_max_min: 60}       # C4 chain: consensus -> best single admitted model -> hold last good (<= 60 min) -> BAD
recommend: {every_min: 5, max_move_F: 5.0, step_F: 0.5, p_on_spec_min: 0.95, valid_min: 30,
            gain_default: 1.0, yield_sens_default: 0.0,
            target_F: {LCO_T98_F: 755.3, HN_T98_F: 530.3},   # 6 Oct: the planned operating point (shift-start set points);
            target_deadband_F: 1.0}                          # the agent aims here, never below 95 % on spec
gemini:
  project: fcc-soft-sensor
  location: us-central1
  text_model: gemini-2.5-flash
  live_model: gemini-live-2.5-flash-native-audio
  live_fallbacks: [gemini-live-2.5-flash-native-audio, gemini-live-2.5-flash-preview-native-audio-09-2025,
                   gemini-live-2.5-flash, gemini-2.0-flash-live-preview-04-09]
  embed_model: gemini-embedding-001
  embed_fallbacks: [gemini-embedding-001, text-embedding-005]
  probe_on_startup: true
  voice: Aoede
knowledge: {min_score_embedding: 0.35, min_score_bm25: 0.35, search_backend: local}   # search_backend: local | bigquery (env FCC_KNOWLEDGE_BACKEND); bigquery = VECTOR_SEARCH over fcc_gold.knowledge_chunks
cors_origins: ["http://localhost:3000", "http://127.0.0.1:3000"]
recipe:                               # E4 (SDD-RCP-02..06) — advisory recipe search; effects in % of feed, penalties per training sd
  weights: {LCO: 1.0, HN: 0.8, LPG: 0.4}
  penalties: {F5_fuel: 0.1, power: 0.1, F_coke: 0.1}
  p_on_spec_min: 0.95
  novelty_max: 0.7
  min_gain_pct_feed: 0.02             # below this the engine says "hold" (gate_reason no_gain)
  step_limits:                        # max move per recipe
    SP_T_riser_ROT_F: 5.0
    SP_T_preheat_F: 5.0
    SP_LCO_T98: 10.0
    SP_HN_T98: 10.0
    SP_T_overhead: 5.0
    Fair: {rel: 0.05}
    MV_reflux_ratio: 0.1
    MV_cw_flow: {rel: 0.05}
  unit_inputs:                        # set points a unit's recipe may move (own SPs + the coordinated upstream move)
    unit_1_furnace: [SP_T_preheat_F]
    unit_2_riser: [SP_T_riser_ROT_F, SP_LCO_T98]   # ROT + the coordinated fractionator cut point
    unit_3_regenerator: [Fair, SP_T_riser_ROT_F]
    unit_4_fractionator: [SP_LCO_T98, SP_HN_T98, SP_T_riser_ROT_F]
    unit_5_condenser: [MV_reflux_ratio, SP_T_overhead, MV_cw_flow]
    unit_6_stabiliser: [MV_reflux_ratio, SP_T_overhead]
iow:                                  # integrity operating windows (engineering limits); {rel: x} = ± x of current value
  SP_T_riser_ROT_F: [955, 985]
  SP_T_preheat_F: [590, 640]
  SP_LCO_T98: [735, 765]
  SP_HN_T98: [515, 540]
  SP_T_overhead: [230, 260]
  Fair: {rel: 0.08}
  MV_reflux_ratio: [0.5, 1.2]
  MV_cw_flow: {rel: 0.15}
plan_tolerances:                      # L0 KPI-vs-plan pill (SDD-L0-01): |value − plan| ≤ tol → OK, ≤ 2·tol → WATCH, else ACT
  T2_preheat_F: 5.0                   # °F vs SP_T_preheat_F
  conversion_pct: 1.0                 # % vs regime-surrogate expected
  dT_cyc_reg_F: 10.0                  # °F afterburn vs expected
  Treg_F: 10.0                        # °F vs SP_T_reg_F
  LCO_T98_F: 3.0                      # °F vs SP_LCO_T98
  HN_T98_F: 3.0                       # °F vs SP_HN_T98
  MV_cw_flow: 15.0                    # lb/s (≈ 5 %) vs expected for this load / ambient
  eff_C5: 1.5                         # % recovery vs expected
